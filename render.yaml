services:
  - type: web
    name: moba-skin-marketplace
    runtime: node
    plan: free
    branch: implementation/full-onchain-product
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/indexer/status
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NEXT_PUBLIC_DEFAULT_CHAIN_ID
        value: "11155111"
      - key: NEXT_PUBLIC_SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: INDEXER_CONFIRMATIONS
        value: "6"
      - key: INDEXER_POLL_INTERVAL_MS
        value: "12000"
